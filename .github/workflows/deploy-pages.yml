name: Deploy to GitHub Pages

# Publishes the static PWA in prototype/ to GitHub Pages.
# The app uses only relative paths, so it works correctly under the
# project-site subpath (https://netbiz-ai.github.io/emma-grace/).

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Give the service worker a unique cache version per deploy so installed
      # devices detect the SW update and purge stale caches. Modifies only the
      # uploaded artifact, not the committed source (which keeps a placeholder).
      - name: Stamp service-worker cache version with deploy SHA
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${VERSION}';/" prototype/sw.js
          echo "Stamped CACHE_VERSION → ${VERSION}"
          grep -n "CACHE_VERSION =" prototype/sw.js

      - name: Upload prototype/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
