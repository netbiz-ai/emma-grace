name: Deploy to GitHub Pages

# Publishes the static PWA in prototype/ to GitHub Pages.
# The app uses only relative paths, so it works correctly under the
# project-site subpath (https://netbiz-ai.github.io/emma-grace/).

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload prototype/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
