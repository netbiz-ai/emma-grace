<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Quill — Grown-ups: Stroke Replay</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Baloo 2', sans-serif;
      background: #2c2550;
      color: #f3eefc;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .sub { opacity: 0.7; margin-bottom: 20px; font-size: 0.95rem; }
    a.back { color: #ffd76b; }
    .layout { display: flex; gap: 24px; flex-wrap: wrap; }
    .list { flex: 1 1 300px; max-width: 420px; max-height: 78vh; overflow-y: auto; }
    .attempt {
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      border: 2px solid transparent;
    }
    .attempt:hover { background: rgba(255,255,255,0.13); }
    .attempt.sel { border-color: #ffd76b; }
    .attempt .g {
      font-size: 1.6rem; font-weight: 700; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1); border-radius: 10px;
    }
    .attempt .meta { font-size: 0.85rem; opacity: 0.85; line-height: 1.35; }
    .badge { font-size: 0.75rem; padding: 1px 8px; border-radius: 99px; margin-left: 6px; }
    .badge.helped { background: #b89cff33; color: #d8ccff; }
    .badge.clean { background: #7ee8a233; color: #aef0c4; }
    .viewer { flex: 1 1 320px; }
    .stage {
      background: #fffaf2; border-radius: 20px;
      width: min(420px, 90vw); aspect-ratio: 100 / 140;
      position: relative;
    }
    svg { width: 100%; height: 100%; }
    .controls { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
    button {
      font-family: inherit; font-weight: 700; font-size: 1rem;
      background: #ffd76b; color: #5a4210; border: none;
      border-radius: 99px; padding: 8px 22px; cursor: pointer;
    }
    .empty { opacity: 0.7; padding: 30px 0; }
  </style>
</head>
<body>
  <h1>🦄 Stroke replay <span style="font-size:0.9rem;opacity:0.6">(for grown-ups)</span></h1>
  <p class="sub">Watch how Emma-Grace's handwriting is coming along. <a class="back" href="index.html">← back to the game</a></p>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="viewer">
      <div class="stage"><svg id="stage" viewBox="0 0 100 140"></svg></div>
      <div class="controls">
        <button id="play">▶ Replay</button>
        <label><input type="checkbox" id="fast"> 2× speed</label>
      </div>
    </div>
  </div>
  <script src="js/letters.js"></script>
  <script src="js/replay.js"></script>
</body>
</html>
